openapi: 3.0.0
info:
  title: Взаимодействие с сервисом мессенджера
  description: "Внутренние запросы к сервису мессенджера. Любая ручка может ответить 500 с телом Error."
  version: 1.0.0

tags:
  - name: "Отправка сообщения"
  - name: "Валидация сессии"

security:
  - internalAuth: []

paths:
  /messages:
    post:
      tags:
        - "Отправка сообщения"
      summary: "Отправка сообщения."
      description: "Отправка сообщения. Отправитель обязан быть участником указанного чата."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendingMessage"
      responses:
        "201": 
          description: "Сообщение отправлено."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/validate:
    post:
      tags:
        - "Валидация сессии"
      summary: "Валидация сессии."
      description: "Валидация сессии."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenValidate"
      responses:
        "200":
          description: "Сессия валидна."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    internalAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: "Некорректный запрос."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "Требуется авторизация."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Недостаточно прав."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Ресурс отсутствует."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SendingMessage:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
        clientMessageId:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
      required:
        - content
        - clientMessageId
        - chatId
        - senderId
    SentMessageResponse:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
        seqnum:
          type: integer
          format: int64
        sentAt:
          type: string
          format: "date-time"
      required:
        - chatId
        - seqnum
        - sentAt
    TokenValidate:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    ValidateResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: "date-time"
      required:
        - userId
        - expiresAt
        - sessionId

    Error:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - validation_failed
            - invalid_token
            - forbidden
            - not_found
            - internal
        message:
          type: string
          description: "Описание для разработчика, не предназначенное для показа пользователю."
      required:
        - code
        - message
