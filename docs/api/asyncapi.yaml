asyncapi: 2.6.0
info:
  title: WebSocket шлюз
  version: 1.0.0
  description: Взаимодействие клиента с шлюзом соединений мессенджера.

tags:
  - name: "Служебные"
  - name: "Авторизация"
  - name: "Сообщения"

channels:
  /ws:
    description: WebSocket путь в шлюзе соединений.
    publish:
      operationId: sendFromUser
      description: Сообщения от клиента к серверу.
      message:
        oneOf:
          - $ref: '#/components/messages/Ping'
          - $ref: '#/components/messages/Authorize'
          - $ref: '#/components/messages/SendMessage'
    subscribe:
      operationId: receiveFromServer
      description: Сообщения от сервера к клиенту.
      message:
        oneOf:
          - $ref: '#/components/messages/Pong'
          - $ref: '#/components/messages/AuthorizeResponse'
          - $ref: '#/components/messages/SendMessageResponse'
          - $ref: '#/components/messages/ReceiveMessage'
          - $ref: '#/components/messages/RequireAuthorize'

components:
  messages:
    Ping:
      name: ping
      description: Уведомление об активности соединения. Должно отправляться для того, чтобы сервер получал каждые 10 секунд минимум по одному сообщению. В противном случае соединение принудительно закрывается.
      tags:
        - name: "Служебные"
      payload:
        $ref: "#/components/schemas/PingPayload"

    Pong:
      name: pong
      description: Ответ на проверку соединения. Позволяет пользователю понять, что сервер достижим.
      tags:
        - name: "Служебные"
      payload:
        $ref: "#/components/schemas/PongPayload"

    Authorize:
      name: authorize
      description: Авторизация пользователя по токену. Данное сообщение обязано быть первым сообщением от пользователя серверу. В противном случае соединение принудительно закрывается.
      tags:
        - name: "Авторизация"
      payload:
        $ref: "#/components/schemas/AuthorizePayload"

    AuthorizeResponse:
      name: authorizeResponse
      description: "Результат авторизации. В случае success: false соединение будет разорвано сервером."
      tags:
        - name: "Авторизация"
      payload:
        $ref: "#/components/schemas/AuthorizeResponsePayload"

    RequireAuthorize:
      name: requireAuthorize
      description: "Указание клиенту повторно авторизоваться. Возникает при приближении к моменту истечения токена. По истечении 5 секунд без авторизации соединение принудительно закрывается сервером."
      tags:
        - name: "Авторизация"
      payload:
        $ref: "#/components/schemas/RequireAuthorizePayload"

    SendMessage:
      name: sendMessage
      description: Отправка сообщения.
      tags:
        - name: "Сообщения"
      payload:
        $ref: "#/components/schemas/SendMessagePayload"

    SendMessageResponse:
      name: sendMessageResponse
      description: Результат отправки сообщения. Сообщение об ошибке считать в данной реализации произвольным.
      tags:
        - name: "Сообщения"
      payload:
        $ref: "#/components/schemas/SendMessageResponsePayload"

    ReceiveMessage:
      name: receiveMessage
      description: Доставка входящего сообщения.
      tags:
        - name: "Сообщения"
      payload:
        $ref: "#/components/schemas/ReceiveMessagePayload"

  schemas:
    PingPayload:
      type: object
      required: [method]
      properties:
        method:
          type: string
          const: ping
          description: Метод сообщения.

    PongPayload:
      type: object
      required: [method]
      properties:
        method:
          type: string
          const: pong
          description: Метод сообщения.

    AuthorizePayload:
      type: object
      required: [method, token]
      properties:
        method:
          type: string
          const: authorize
          description: Метод сообщения.
        token:
          type: string
          description: Токен авторизации.

    AuthorizeResponsePayload:
      type: object
      required: [method, success]
      properties:
        method:
          type: string
          const: authorizeResponse
          description: Метод сообщения.
        success:
          type: boolean
          description: "Успешность авторизации."

    RequireAuthorizePayload:
      type: object
      required: [method]
      properties:
        method:
          type: string
          const: requireAuthorize
          description: Метод сообщения.

    SendMessagePayload:
      type: object
      required: [method, chatId, message, clientMessageId]
      properties:
        method:
          type: string
          const: sendMessage
          description: Метод сообщения.
        chatId:
          type: string
          format: uuid
          description: Идентификатор чата.
        message:
          $ref: "#/components/schemas/SentMessage"
        clientMessageId:
          type: string
          format: uuid
          description: Клиентский идентификатор сообщения, сгенерированный на клиенте случайным образом.

    SendMessageResponsePayload:
      type: object
      required: [method, clientMessageId, success]
      properties:
        method:
          type: string
          const: sendMessageResponse
          description: Метод сообщения.
        clientMessageId:
          type: string
          format: uuid
          description: Клиентский идентификатор сообщения.
        success:
          type: boolean
          description: "Успешность отправки сообщения."
        error:
          type: string
          description: "Описание ошибки в случае ее возникновения."
        seqnum:
          type: integer
          description: Порядковый номер сообщения.
        sentAt:
          type: string
          format: "date-time"
          description: Время отправки сообщения, присвоенное сервером.

    ReceiveMessagePayload:
      type: object
      required: [method, chatId, senderId, message, seqnum]
      properties:
        method:
          type: string
          const: receiveMessage
          description: Метод сообщения.
        chatId:
          type: string
          format: uuid
          description: Идентификатор чата.
        senderId:
          type: string
          format: uuid
          description: Идентификатор отправителя.
        message:
          $ref: "#/components/schemas/Message"
        seqnum:
          type: integer
          description: Порядковый номер сообщения.

    Message:
      type: object
      description: Входящее сообщение.
      required: [content, sentAt]
      properties:
        content:
          type: string
          minLength: 1
          description: Текст сообщения.
        sentAt:
          type: string
          format: "date-time"
          description: Время отправки сообщения.

    SentMessage:
      type: object
      description: Исходящее сообщение.
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 100
          description: Текст сообщения. Максимальная длина составляет.
