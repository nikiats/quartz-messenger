openapi: 3.0.0
info:
  title: Взаимодействие с шлюзом соединений
  description: Внутренние запросы к шлюзу соединений
  version: 1.0.0

tags:
  - name: "Передача сообщений"
  - name: "Управление соединениями"

security:
  - internalAuth: []

paths:
  /deliver:
    post:
      tags:
        - "Передача сообщений"
      summary: "Доставка сообщения указанному пользователю."
      description: "Доставка сообщения указанному пользователю."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceivedMessage"
      responses:
        "202":
          description: "Сообщение передано в доставку."
        "400":
          description: "Некорректный запрос."
  /connections/{sessionId}:
    delete:
      tags:
        - "Управление соединениями"
      summary: "Разрыв соединений указанной сессии."
      description: "Разрыв соединений указанной сессии."
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "Соединение разорвано или отсутствует."

components:
  securitySchemes:
    internalAuth:
      type: http
      scheme: bearer
  schemas:
    ReceivedMessage:
      type: object
      properties:
        content:
          type: string
        chatId:
          type: string
        senderId:
          type: string
        recipientId:
          type: string
        seqnum:
          type: integer
          format: int64
        sentAt:
          type: string
          format: "date-time"
      required:
        - content
        - chatId
        - senderId
        - recipientId
        - seqnum
        - sentAt