openapi: 3.0.0
info:
  title: Взаимодействие с сервисом мессенджера
  description: Внутренние запросы к сервису мессенджера
  version: 1.0.0

tags:
  - name: "Отправка сообщения"
  - name: "Валидация сессии"

security:
  - internalAuth: []

paths:
  /messages:
    post:
      tags:
        - "Отправка сообщения"
      summary: "Отправка сообщения."
      description: "Отправка сообщения."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendingMessage"
      responses:
        "201": 
          description: "Сообщение отправлено."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentMessageResponse"
        "400":
          description: "Некорректный запрос."
  /sessions/validate:
    post:
      tags:
        - "Валидация сессии"
      summary: "Валидация сессии."
      description: "Валидация сессии."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenValidate"
      responses:
        "200":
          description: "Сессия валидна."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "401":
          description: "Сессия невалидна."

components:
  securitySchemes:
    internalAuth:
      type: http
      scheme: bearer
  schemas:
    SendingMessage:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 100
        clientMessageId:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
      required:
        - content
        - clientMessageId
        - chatId
        - senderId
    SentMessageResponse:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
        seqnum:
          type: integer
          format: int64
        sentAt:
          type: string
          format: "date-time"
      required:
        - chatId
        - seqnum
        - sentAt
    TokenValidate:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    ValidateResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: "date-time"
      required:
        - userId
        - expiresAt
        - sessionId
