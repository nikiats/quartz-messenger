openapi: 3.0.0
info:
  title: Взаимодействие с сервисом сообщений
  description: Внутренние запросы к сервису сообщений
  version: 1.0.0

tags:
  - name: "Отправка сообщения"
  - name: "Валидация сессии"

paths:
  /message:
    post:
      tags:
        - "Отправка сообщения"
      summary: "Отправка сообщения."
      description: "Отправка сообщения."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SentMessage"
      responses:
        "201": 
          description: "Сообщение отправлено."
        "400":
          description: "Некорректный запрос."
  /sessions/validate:
    post:
      tags:
        - "Валидация сессии"
      summary: "Валидация сессии."
      description: "Валидация сессии."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenValidate"
      responses:
        "200":
          description: "Сессия валидна."
        "401":
          description: "Сессия невалидна."

components:
  schemas:
    SentMessage:
      type: object
      properties:
        content:
          type: string
        chatId:
          type: string
        senderId:
          type: string
        recepientId:
          type: string
        sentAt:
          type: string
          format: "date-time"
      required:
        - content
        - chatId
        - senderId
        - recepientId
        - sentAt
    TokenValidate:
      type: object
      properties:
        token:
          type: string
      required:
        - token