asyncapi: 2.6.0
info:
  title: WebSocket шлюз
  version: 1.0.0
  description: Взаимодействие клиента с шлюзом соединений мессенджера. Назначение - передача сообщений. Остальные события в рамках текущей реализации должны быть получены через запросы напрямую к сервису мессенджера.

tags:
  - name: "Служебные"
  - name: "Авторизация"
  - name: "Сообщения"

channels:
  /ws:
    description: WebSocket путь в шлюзе соединений.
    publish:
      operationId: sendFromUser
      description: Сообщения от клиента к серверу.
      message:
        oneOf:
          - $ref: '#/components/messages/Ping'
          - $ref: '#/components/messages/Authorize'
          - $ref: '#/components/messages/SendMessage'
    subscribe:
      operationId: receiveFromServer
      description: Сообщения от сервера к клиенту.
      message:
        oneOf:
          - $ref: '#/components/messages/Pong'
          - $ref: '#/components/messages/AuthorizeResponse'
          - $ref: '#/components/messages/SendMessageResponse'
          - $ref: '#/components/messages/ReceiveMessage'
          - $ref: '#/components/messages/RequireAuthorize'
          - $ref: '#/components/messages/Error'

components:
  messages:
    Ping:
      name: ping
      description: Уведомление об активности соединения. Должно отправляться для того, чтобы сервер получал каждые 60 секунд минимум по одному сообщению. В противном случае соединение принудительно закрывается.
      tags:
        - name: "Служебные"
      payload:
        $ref: "#/components/schemas/PingPayload"

    Pong:
      name: pong
      description: Ответ на проверку соединения. Позволяет пользователю понять, что сервер достижим.
      tags:
        - name: "Служебные"
      payload:
        $ref: "#/components/schemas/PongPayload"

    Authorize:
      name: authorize
      description: "Авторизация пользователя по токену. 
        > Первое сообщение от клиента обязано быть авторизационным. 
        > В противном случае соединение принудительно закрывается. 
        > При повторной авторизации выполняется проверка совпадения данных пользователя с предыдущими. При несовпадении соединение закрывается."
      tags:
        - name: "Авторизация"
      payload:
        $ref: "#/components/schemas/AuthorizePayload"

    SendMessage:
      name: sendMessage
      description: "Отправка сообщения. Важно: при возникновении ошибки, она возвращается через sendMessageResponse только в случае, если относится к бизнес-логике. Структурные ошибки возвращаются общей операцией error."
      tags:
        - name: "Сообщения"
      payload:
        $ref: "#/components/schemas/SendMessagePayload"

    AuthorizeResponse:
      name: authorizeResponse
      description: "Результат авторизации. В случае success: false соединение будет разорвано сервером."
      tags:
        - name: "Авторизация"
      payload:
        $ref: "#/components/schemas/AuthorizeResponsePayload"

    RequireAuthorize:
      name: requireAuthorize
      description: "Указание клиенту повторно авторизоваться. Возникает при приближении к моменту истечения токена (ориентировочно за 30 секунд). При непродлении сессии, в момент истечения токена соединение принудительно закрывается сервером."
      tags:
        - name: "Авторизация"
      payload:
        $ref: "#/components/schemas/RequireAuthorizePayload"

    Error:
      name: error
      description: "Ошибка обработки сообщения, не относящаяся к конкретной операции: неразбираемый JSON, неизвестный метод, превышение допустимого размера."
      tags:
        - name: "Служебные"
      payload:
        $ref: "#/components/schemas/ErrorPayload"

    SendMessageResponse:
      name: sendMessageResponse
      description: Результат отправки сообщения.
      tags:
        - name: "Сообщения"
      payload:
        $ref: "#/components/schemas/SendMessageResponsePayload"

    ReceiveMessage:
      name: receiveMessage
      description: Доставка входящего сообщения.
      tags:
        - name: "Сообщения"
      payload:
        $ref: "#/components/schemas/ReceiveMessagePayload"

  schemas:
    ErrorBody:
      type: object
      description: Причина отказа.
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки.
          enum:
            - session_mismatch
            - session_invalid
            - send_failed
            - internal
            - invalid_payload
        message:
          type: string
          description: Описание ошибки.

    ErrorPayload:
      type: object
      required: [method, error]
      properties:
        method:
          type: string
          const: error
          description: Метод сообщения.
        error:
          $ref: "#/components/schemas/ErrorBody"

    PingPayload:
      type: object
      required: [method]
      properties:
        method:
          type: string
          const: ping
          description: Метод сообщения.

    PongPayload:
      type: object
      required: [method]
      properties:
        method:
          type: string
          const: pong
          description: Метод сообщения.

    AuthorizePayload:
      type: object
      required: [method, token]
      properties:
        method:
          type: string
          const: authorize
          description: Метод сообщения.
        token:
          type: string
          description: Токен авторизации.

    AuthorizeResponsePayload:
      type: object
      required: [method, success]
      properties:
        method:
          type: string
          const: authorizeResponse
          description: Метод сообщения.
        success:
          type: boolean
          description: "Успешность авторизации."
        error:
          $ref: "#/components/schemas/ErrorBody"

    RequireAuthorizePayload:
      type: object
      required: [method]
      properties:
        method:
          type: string
          const: requireAuthorize
          description: Метод сообщения.

    SendMessagePayload:
      type: object
      required: [method, chatId, message, clientMessageId]
      properties:
        method:
          type: string
          const: sendMessage
          description: Метод сообщения.
        chatId:
          type: string
          format: uuid
          description: Идентификатор чата.
        message:
          $ref: "#/components/schemas/SentMessage"
        clientMessageId:
          type: string
          format: uuid
          description: Клиентский идентификатор сообщения, сгенерированный на клиенте случайным образом.

    SendMessageResponsePayload:
      type: object
      required: [method, clientMessageId, success]
      properties:
        method:
          type: string
          const: sendMessageResponse
          description: Метод сообщения.
        clientMessageId:
          type: string
          format: uuid
          description: Клиентский идентификатор сообщения.
        success:
          type: boolean
          description: "Успешность отправки сообщения."
        error:
          $ref: "#/components/schemas/ErrorBody"
        seqnum:
          type: integer
          format: int64
          description: Порядковый номер сообщения.
        sentAt:
          type: string
          format: "date-time"
          description: Время отправки сообщения, присвоенное сервером.

    ReceiveMessagePayload:
      type: object
      required: [method, chatId, senderId, message, seqnum, sentAt]
      properties:
        method:
          type: string
          const: receiveMessage
          description: Метод сообщения.
        chatId:
          type: string
          format: uuid
          description: Идентификатор чата.
        senderId:
          type: string
          format: uuid
          description: Идентификатор отправителя.
        message:
          $ref: "#/components/schemas/Message"
        seqnum:
          type: integer
          format: int64
          description: Порядковый номер сообщения.
        sentAt:
          type: string
          format: "date-time"
          description: Время отправки сообщения.

    Message:
      type: object
      description: Входящее сообщение.
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
          description: Текст сообщения.

    SentMessage:
      type: object
      description: Исходящее сообщение.
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
          description: Текст сообщения.
