openapi: 3.0.0
info:
  title: Взаимодействие с шлюзом соединений
  description: "Внутренние запросы к шлюзу соединений. Любая ручка может ответить 500 с телом Error."
  version: 1.0.0

tags:
  - name: "Передача сообщений"
  - name: "Управление соединениями"

security:
  - internalAuth: []

paths:
  /deliver:
    post:
      operationId: deliverMessage
      tags:
        - "Передача сообщений"
      summary: "Доставка сообщения указанному пользователю."
      description: "Доставка сообщения указанному пользователю. 
        Не стоит использовать данный запрос для отправки отправленного пользователем сообщения на его другие устройства (соединения). 
        Независимо от успешности доставки, возвращает код 202."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceivedMessage"
      responses:
        "202":
          description: "Сообщение передано в доставку."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /connections/{sessionId}:
    delete:
      operationId: invalidateSession
      tags:
        - "Управление соединениями"
      summary: "Разрыв соединений указанной сессии."
      description: "Разрыв соединений указанной сессии. Сразу отмечает сессию как невалидную, не позволяя выполнять под ней действия."
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Соединение разорвано или отсутствует."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    internalAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: "Некорректный запрос."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error400"
    Unauthorized:
      description: "Требуется авторизация."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error401"
    InternalError:
      description: "Внутренняя ошибка."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error500"
  schemas:
    ReceivedMessage:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
        seqnum:
          type: integer
          format: int64
        senderId:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        message:
          type: object
          properties:
            content:
              type: string
          required:
            - content
        sentAt:
          type: string
          format: "date-time"
      required:
        - chatId
        - seqnum
        - message
        - senderId
        - recipientId
        - sentAt

    Error400:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - invalid_request
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message
    Error401:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - unauthorized_request
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message
    Error500:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - internal
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message