openapi: 3.0.0
info:
  title: Взаимодействие с шлюзом соединений
  description: "Внутренние запросы к шлюзу соединений. Любая ручка может ответить 500 с телом Error."
  version: 1.0.0

tags:
  - name: "Передача сообщений"
  - name: "Управление соединениями"

security:
  - internalAuth: []

paths:
  /deliver:
    post:
      operationId: deliverMessage
      tags:
        - "Передача сообщений"
      summary: "Доставка сообщения указанному пользователю."
      description: "Доставка сообщения указанному пользователю. 
        > Не стоит использовать данный запрос для отправки отправленного пользователем сообщения на его другие устройства (соединения). 
        > Независимо от успешности доставки возвращает код 202."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceivedMessage"
      responses:
        "202":
          description: "Сообщение передано в доставку."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /connections/{sessionId}:
    delete:
      operationId: invalidateSession
      tags:
        - "Управление соединениями"
      summary: "Разрыв соединений указанной сессии."
      description: "Разрыв соединений указанной сессии."
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Соединение разорвано или отсутствует."
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    internalAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: "Некорректный запрос."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "Требуется авторизация."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ReceivedMessage:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
        seqnum:
          type: integer
          format: int64
        senderId:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        content:
          type: string
        sentAt:
          type: string
          format: "date-time"
      required:
        - chatId
        - seqnum
        - content
        - senderId
        - recipientId
        - sentAt

    Error:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - validation_failed
            - invalid_token
            - forbidden
            - not_found
            - internal
        message:
          type: string
          description: "Описание для разработчика, не предназначенное для показа пользователю."
      required:
        - code
        - message
