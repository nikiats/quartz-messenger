openapi: 3.0.0
info:
  title: Взаимодействие с сервисом мессенджера
  description: "Внутренние запросы к сервису мессенджера."
  version: 1.0.0

tags:
  - name: "Отправка сообщения"
  - name: "Валидация сессии"

security:
  - internalAuth: []

paths:
  /messages:
    post:
      operationId: sendMessage
      tags:
        - "Отправка сообщения"
      summary: "Отправка сообщения."
      description: "Отправка сообщения. Отправитель обязан быть участником указанного чата."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendingMessage"
      responses:
        "200": 
          description: "Результат отправки сообщения."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/validate:
    post:
      operationId: validateSession
      tags:
        - "Валидация сессии"
      summary: "Валидация сессии."
      description: "Валидация сессии."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenValidate"
      responses:
        "200":
          description: "Результат валидации сессии."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    internalAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: "Некорректный запрос."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error400"
    Unauthorized:
      description: "Не авторизован."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error401"
    InternalError:
      description: "Внутренняя ошибка."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error500"

  schemas:
    SendingMessage:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/MessageContent"
        clientMessageId:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
      required:
        - content
        - clientMessageId
        - chatId
        - senderId
        - sessionId

    MessageContent:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - text

    SentMessageResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          $ref: "#/components/schemas/SendMessageError"
        message:
          $ref: "#/components/schemas/SentMessage"
      required:
        - success

    SendMessageError:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - send_failed
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message

    SentMessage:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
        seqnum:
          type: integer
          format: int64
        sentAt:
          type: string
          format: "date-time"
      required:
        - chatId
        - seqnum
        - sentAt

    TokenValidate:
      type: object
      properties:
        token:
          type: string
      required:
        - token
      
    ValidateResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          $ref: "#/components/schemas/ValidateSessionError"
        session:
          $ref: "#/components/schemas/SessionInfo"
      required:
        - success

    ValidateSessionError:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - authorization_failed
            - session_expired
            - session_revoked
            - suspended_user
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message

    SessionInfo:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: "date-time"
      required:
        - userId
        - sessionId
        - expiresAt

    Error400:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - invalid_request
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message
    Error401:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - unauthorized_request
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message
    Error500:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - internal
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message

