openapi: 3.0.0
info:
  title: Взаимодействие с сервисом мессенджера
  description: "Внутренние запросы к сервису мессенджера."
  version: 1.0.0

tags:
  - name: "Отправка сообщения"
  - name: "Валидация сессии"

security:
  - internalAuth: []

paths:
  /messages:
    post:
      operationId: sendMessage
      tags:
        - "Отправка сообщения"
      summary: "Отправка сообщения."
      description: "Отправка сообщения. Отправитель обязан быть участником указанного чата."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendingMessage"
      responses:
        "200": 
          description: "Результат отправки сообщения."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/validate:
    post:
      operationId: validateSession
      tags:
        - "Валидация сессии"
      summary: "Валидация сессии."
      description: "Валидация сессии."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenValidate"
      responses:
        "200":
          description: "Сессия валидна."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    internalAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: "Некорректный запрос."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error400"
    Unauthorized:
      description: "Не авторизован."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error401"
    InternalError:
      description: "Внутренняя ошибка."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error500"

  schemas:
    SendingMessage:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
        clientMessageId:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
      required:
        - content
        - clientMessageId
        - chatId
        - senderId
        - sessionId

    SentMessageResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
              description: "Машиночитаемый код ошибки."
              enum:
                - send_failed
            message:
              type: string
              description: "Описание ошибки."
          required:
            - code
            - message
        message:
          type: object
          properties:
            chatId:
              type: string
              format: uuid
            seqnum:
              type: integer
              format: int64
            sentAt:
              type: string
              format: "date-time"
          required:
            - chatId
            - seqnum
            - sentAt
      required:
        - success

    TokenValidate:
      type: object
      properties:
        token:
          type: string
      required:
        - token
      
    ValidateResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
              description: "Машиночитаемый код ошибки."
              enum:
                - invalid_token
            message:
              type: string
              description: "Описание ошибки."
          required:
            - code
            - message
        session:
          type: object
          properties:
            userId:
              type: string
              format: uuid
            sessionId:
              type: string
              format: uuid
            expiresAt:
              type: string
              format: "date-time"
          required:
            - userId
            - sessionId
            - expiresAt
      required:
        - success

    Error400:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - invalid_request
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message
    Error401:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - unauthorized_request
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message
    Error500:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - internal_error
        message:
          type: string
          description: "Описание ошибки."
      required:
        - code
        - message

