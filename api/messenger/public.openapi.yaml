openapi: 3.0.0
info:
  title: Взаимодействие клиента с сервисом мессенджера
  description: "Клиентские запросы к сервису мессенджера. Любой запрос может ответить 500 с телом Error. При отсутствии у пользователя принадлежности к ресурсу, возвращается код 404 во избежание раскрытия существования ресурсов с данным идентификатором."
  version: 1.0.0

tags:
  - name: "Авторизация"
  - name: "Пользователи"
  - name: "Чаты"
  - name: "Участники чатов"
  - name: "Сообщения"

security:
  - bearerAuth: []

paths:
  /users:
    post:
      operationId: registerUser
      tags:
        - Авторизация
      summary: Создание пользователя.
      description: Создание пользователя.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Пользователь создан.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: searchUsers
      tags:
        - "Пользователи"
      summary: "Поиск пользователей по юзернейму."
      description: "Поиск пользователей по юзернейму."
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "Список найденных пользователей. Алгоритм выдачи определяется конкретной реализацией сервера включая возможную выдачу пустого результата при слишком коротком запросе."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{id}:
    get:
      operationId: getUserInfo
      tags:
        - "Пользователи"
      summary: "Информация о пользователе."
      description: "Информация о пользователе."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Информация о пользователе."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions:
    post:
      operationId: loginSession
      tags:
        - Авторизация
      summary: Создать сессию.
      description: Создать сессию.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Сессия создана.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Действие аккаунта пользователя было приостановлено."
          $ref: "#/components/responses/Forbidden"
  /tokens:
    post:
      operationId: refreshToken
      tags:
        - Авторизация
      summary: "Обновление токена."
      description: "Обновление токена. При обновлении выполняется проверка, что сессия не отозвана и ее срок действия не закончился."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRefresh"
      responses:
        "200":
          description: "Выдан новый токен."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sessions/{id}:
    delete:
      operationId: invalidateSession
      tags:
        - Авторизация
      summary: Инвалидировать сессию.
      description: Инвалидировать сессию. Инвалидация доступна только для собственных сессий.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Сессия инвалидирована
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /profile:
    patch:
      operationId: editProfile
      tags:
        - "Пользователи"
      summary: "Изменение настроек профиля пользователя."
      description: "Изменение настроек профиля пользователя."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileEdit"
      responses:
        "200":
          description: "Настройки успешно изменены."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /chats:
    get:
      operationId: getChats
      tags:
        - "Чаты"
      summary: "Список чатов пользователя."
      description: "Список чатов пользователя. Удаленные чаты отсутствуют в выдаче."
      responses:
        "200":
          description: "Список чатов."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chat"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createChat
      tags:
        - "Чаты"
      summary: "Создать чат."
      description: "Создать чат. При создании личного чата, который уже существует, будут возвращены его данные. После удаления личного чата, его можно создать заново."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCreate"
      responses:
        "201":
          description: "Чат создан."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "200":
          description: "Чат существует."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /chats/{id}:
    get:
      operationId: getChatInfo
      tags:
        - "Чаты"
      summary: "Получение информации о чате."
      description: "Получение информации о чате. Информацию об удаленном чате получить невозможно."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Информация о чате."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteChat
      tags:
        - "Чаты"
      summary: "Удаление чата."
      description: "Удаление чата. Для группового чата доступно исключительно администратору. Для личного чата доступно любому из участников."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Чат удален."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /chats/{id}/messages:
    get:
      operationId: getMessages
      tags:
        - "Сообщения"
      summary: "История сообщений чата."
      description: "История сообщений чата.
        > Параметры before и after нельзя использовать одновременно.
        > Сообщения отсортированы в порядке от точки загрузки - before/after в направлении незагруженных сообщений.
        > Результат поиска отсортирован от новых сообщений к старым."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: before
          in: query
          schema:
            type: integer
            format: int64
        - name: after
          in: query
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: integer
        - name: q
          in: query
          description: "Строка поиска: вхождение подстроки без учета регистра."
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: "Сообщения чата. Обязательно указание либо before, либо after. Поиск пагинируется вверх с помощью before. Неуказание способа пагинации или указание обоих сразу или поиск с пагинацией не before является некорректным запросом."
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasMore:
                    type: boolean
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendMessage
      tags:
        - "Сообщения"
      summary: "Отправка сообщения."
      description: "Отправка сообщения.
        > Повторная отправка с тем же clientMessageId не создает новое сообщение,
        > а возвращает ранее сохраненное."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessage"
      responses:
        "201":
          description: "Сообщение отправлено."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /chats/{id}/members:
    get:
      operationId: getChatMembers
      tags:
        - "Участники чатов"
      summary: "Участники чата."
      description: "Участники чата. Для удаленного чата получить список участников невозможно."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Участники чата."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addChatMember
      tags:
        - "Участники чатов"
      summary: "Добавить участника."
      description: "Добавить участника."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberAdd"
      responses:
        "201":
          description: "Участник добавлен."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Чат или добавляемый пользователь не найден (not_found)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Пользователь уже является участником чата (already_member)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /chats/{id}/members/{userId}:
    delete:
      operationId: deleteChatMember
      tags:
        - "Участники чатов"
      summary: "Удаление участника."
      description: "Удаление участника из чата. Удаление собственного пользователя из чата является выходом из чата и доступно каждому участнику. Удаление других участников доступно исключительно администратору. Выход администратора приводит к назначению нового псевдослучайным образом. Из личного чата выход невозможен."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Участник удален."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: "Некорректный запрос."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "Требуется авторизация."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Недостаточно прав."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Ресурс отсутствует."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "Конфликт с текущим состоянием."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    UserCreate:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      required:
        - login
        - password

    SessionCredentials:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        sessionId:
          type: string
          format: uuid
      required:
        - token
        - refreshToken
        - sessionId

    SessionCreate:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      required:
        - login
        - password
    
    SessionRefresh:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    
    ProfileEdit:
      type: object
      properties:
        visibleName:
          type: string
        username:
          type: string

    Chat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - private
            - group
        title:
          description: "Название чата. В случае с личным чатом подставляется отображаемое имя собеседника."
          type: string
        lastMessageAt:
          type: string
          format: "date-time"
        lastSeqnum:
          type: integer
          format: int64
      required:
        - id
        - type
        - lastSeqnum
        - lastMessageAt

    ChatCreate:
      type: object
      properties:
        type:
          type: string
          enum:
            - private
            - group
        title:
          description: "Название группового чата. Обязательно для группового чата, запрещено для личного."
          type: string
          minLength: 1
          maxLength: 100
        memberIds:
          description: "Список участников, добавляемых в чат, за исключением текущего пользователя.
            > Присутствие в списке текущего пользователя или повторяющихся идентификаторов делает запрос некорректным (400).
            > Для личного чата обязательно должен содержать единственного участника - собеседника, с которым создается чат."
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
        - type
        - memberIds

    Message:
      type: object
      properties:
        chatId:
          type: string
          format: uuid
        seqnum:
          type: integer
          format: int64
        senderId:
          type: string
          format: uuid
        content:
          type: string
        sentAt:
          type: string
          format: "date-time"
      required:
        - seqnum
        - senderId
        - content
        - sentAt

    SendMessage:
      type: object
      properties:
        clientMessageId:
          type: string
          format: uuid
        content:
          minLength: 1
          maxLength: 1000
          type: string
      required:
        - clientMessageId
        - content

    Member:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - regular
            - admin
      required:
        - userId
        - role

    MemberAdd:
      type: object
      properties:
        userId:
          type: string
          format: uuid
      required:
        - userId

    User:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          minLength: 1
        visibleName:
          type: string
          minLength: 1
      required:
        - userId

    UserSearchResponse:
      type: array
      items:
        $ref: "#/components/schemas/User"

    Error:
      type: object
      properties:
        code:
          type: string
          description: "Машиночитаемый код ошибки."
          enum:
            - validation_failed
            - invalid_credentials
            - invalid_token
            - forbidden
            - not_found
            - login_taken
            - username_taken
            - already_member
            - suspended_user
            - internal
        message:
          type: string
          description: "Описание для разработчика, не предназначенное для показа пользователю."
      required:
        - code
        - message
