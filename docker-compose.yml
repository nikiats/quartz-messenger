name: quartz

services:
  postgres:
    container_name: qm_postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quartz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quartz}
      POSTGRES_DB: quartz
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quartz -d quartz"]
      interval: 5s
      timeout: 3s
      retries: 10

  cassandra:
    container_name: qm_cassandra
    image: cassandra:5
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: quartz
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  cassandra-init:
    container_name: qm_cassandra_init
    image: cassandra:5
    restart: "no"
    entrypoint: ["cqlsh", "cassandra", "-f", "/schema/schema.cql"]
    volumes:
      - ./docs/act2_scale/schema_cassandra.sql:/schema/schema.cql:ro
    depends_on:
      cassandra:
        condition: service_healthy

  cassandra-web:
    container_name: qm_cassandra_web
    image: ipushc/cassandra-web:latest
    restart: unless-stopped
    environment:
      HOST_PORT: ":80"
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_USERNAME: cassandra
      CASSANDRA_PASSWORD: cassandra
    ports:
      - "127.0.0.1:${CASSANDRA_WEB_PORT:-8090}:80"
    depends_on:
      cassandra:
        condition: service_healthy

  redis:
    container_name: qm_redis
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redisinsight:
    container_name: qm_redisinsight
    image: redis/redisinsight:latest
    profiles: [tools]
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: quartz
    ports:
      - "127.0.0.1:5540:5540"
    depends_on:
      redis:
        condition: service_healthy

  nats:
    container_name: qm_nats
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  nui:
    container_name: qm_nui
    image: ghcr.io/nats-nui/nui:latest
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "127.0.0.1:31311:31311"
    depends_on:
      nats:
        condition: service_healthy

  opensearch:
    container_name: qm_opensearch
    image: opensearchproject/opensearch:3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  opensearch-dashboards:
    container_name: qm_opensearch_dashboards
    image: opensearchproject/opensearch-dashboards:3
    profiles: [tools]
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  messenger:
    container_name: qm_messenger
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args:
        SERVICE: messenger
    restart: unless-stopped
    environment:
      PUBLIC_HTTP_ADDR: ":8080"
      POSTGRES_URL: postgres://quartz:${POSTGRES_PASSWORD:-quartz}@postgres:5432/quartz?sslmode=disable
      CASSANDRA_HOSTS: cassandra:9042
      CASSANDRA_KEYSPACE: quartz_messenger
      REDIS_ADDR: redis:6379
      IDEMPOTENCY_TTL: ${IDEMPOTENCY_TTL:-24h}
      NATS_URL: nats://nats:4222
      OPENSEARCH_URL: http://opensearch:9200
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ACCESS_TTL: ${ACCESS_TTL:-15m}
      REFRESH_TTL: ${REFRESH_TTL:-168h}
      ARGON2_MEMORY: ${ARGON2_MEMORY:-19456}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-2}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      ARGON2_SALT_LENGTH: 16
      ARGON2_KEY_LENGTH: 32
    depends_on:
      postgres:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  gateway:
    container_name: qm_gateway
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args:
        SERVICE: gateway
    restart: unless-stopped
    environment:
      WS_ADDR: ":9080"
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ORIGIN_PATTERNS: ${ORIGIN_PATTERNS:-localhost}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  web:
    container_name: qm_web
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      - messenger
      - gateway

volumes:
  postgres-data:
  cassandra-data:
  redis-data:
  nats-data:
  opensearch-data:
