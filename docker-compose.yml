services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quaztz
      POSTGRES_PASSWORD: quaztz
      POSTGRES_DB: quaztz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quaztz -d quaztz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
