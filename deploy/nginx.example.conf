# главный конфиг nginx: процессы и лимиты соединений
# рабочая копия - deploy/nginx.conf (не в репозитории), без неё образ собирается с этим файлом

user  nginx;
worker_processes  auto;

# лимит открытых файлов воркера: каждое соединение - файловый дескриптор, держать >= worker_connections
worker_rlimit_nofile  2048;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    # соединений на воркер: клиентские и к бэкендам; WebSocket-пользователь занимает два
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
