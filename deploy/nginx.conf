# единая точка входа: статика клиента, публичное API мессенджера, WebSocket шлюза

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    client_max_body_size 64k;

    # публичное API сервиса мессенджера; слэш в конце proxy_pass срезает префикс /api
    location /api/ {
        proxy_pass http://messenger:8080/;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket шлюза соединений
    location = /ws {
        proxy_pass http://gateway:9080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # $http_host сохраняет порт: шлюз сверяет Origin с Host
        proxy_set_header Host       $http_host;
        proxy_set_header X-Real-IP  $remote_addr;
        # больше таймаута простоя шлюза (60 секунд)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ассеты с хешем в имени не меняются - кешируются навсегда
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: неизвестные пути отдаются как index.html, роутинг в браузере
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
