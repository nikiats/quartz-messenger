# единая точка входа: статика клиента, публичное API мессенджера, WebSocket шлюза

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    client_max_body_size 64k;

    # DNS docker-сети: адреса сервисов резолвятся на каждый запрос,
    # поэтому перезапуск контейнера со сменой IP не ломает проксирование
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $messenger messenger:8080;
    set $gateway   gateway:9080;

    # публичное API сервиса мессенджера без префикса /api
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$messenger;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket шлюза соединений
    location = /ws {
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # $http_host сохраняет порт: шлюз сверяет Origin с Host
        proxy_set_header Host       $http_host;
        proxy_set_header X-Real-IP  $remote_addr;
        # больше таймаута простоя шлюза (60 секунд)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ассеты vite с хешем в имени не меняются - кешируются навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: неизвестные пути отдаются как index.html, роутинг в браузере
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
